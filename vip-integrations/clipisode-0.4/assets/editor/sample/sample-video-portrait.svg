<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sample intro video preview">
  <!--
    Editor-only sample video poster (portrait / mobile shape). Used as a
    background image inside the intro screen's editor canvas so authors
    can see WHERE the topic's intro video will paint on the public flow.
    Not shown to guests.

    Design: warm cinematic gradient that reads as "host on camera" without
    looking like an actual person; centred Clipisode play glyph in white
    so the author also sees the play-button affordance landing position.
  -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a8a"/>
      <stop offset="55%" stop-color="#0f1e4f"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <radialGradient id="g2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 200, 130, 0.18)"/>
      <stop offset="60%" stop-color="rgba(255, 200, 130, 0)"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#g1)"/>
  <rect width="360" height="640" fill="url(#g2)"/>
  <!-- Subtle horizon-line "video frame" cue. -->
  <rect x="0" y="320" width="360" height="1" fill="rgba(255,255,255,0.05)"/>
  <!-- Centred Clipisode play glyph. -->
  <g transform="translate(180 320)">
    <circle r="44" fill="rgba(255,255,255,0.18)"/>
    <path d="M -14 -20 L 22 0 L -14 20 Z" fill="#ffffff"/>
  </g>
  <!-- Hint text in the bottom-left corner so the editor preview is unmistakeably-not-a-real-frame. -->
  <text x="20" y="612" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.55)" letter-spacing="0.08em">SAMPLE — TOPIC INTRO VIDEO</text>
</svg>
